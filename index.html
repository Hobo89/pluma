<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("theme");
          if (theme !== "light" && theme !== "dark") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          document.documentElement.classList.toggle("dark", theme === "dark");
          document.documentElement.style.colorScheme = theme;

          var lang = localStorage.getItem("language");
          if (lang !== "en" && lang !== "es") {
            var list =
              navigator.languages && navigator.languages.length
                ? navigator.languages
                : [navigator.language];
            lang = "en";
            for (var i = 0; i < list.length; i++) {
              var base = String(list[i] || "")
                .toLowerCase()
                .replace(/_/g, "-")
                .split("-")[0];
              if (base === "es" || base === "en") {
                lang = base;
                break;
              }
            }
          }
          document.documentElement.lang = lang === "es" ? "es-ES" : "en-US";
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="/favicon.ico?v=3" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Personalized massage in a quiet home studio near Valencia’s Central Market. Choose a 60-, 90-, or 120-minute session with Stephen."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#082707" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&family=Parkinsans:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <!-- Homepage first-paint guard for the responsive hero intro. -->
    <script>
      (function () {
        try {
          var path = location.pathname.replace(/\/+$/, "") || "/";
          if (path !== "/" && path !== "/index.html") return;
          var s = document.createElement("script");
          s.src = "/pluma-hero/boot.js";
          document.head.appendChild(s);
        } catch (e) {}
      })();
    </script>
    <link
      rel="preload"
      as="image"
      href="/pluma-hero/assets/massage-1280.webp"
      imagesrcset="/pluma-hero/assets/massage-640.webp 640w, /pluma-hero/assets/massage-1280.webp 1280w, /pluma-hero/assets/massage-1920.webp 1920w"
      imagesizes="(max-width: 699px) 92vw, min(72vw, 980px)"
      type="image/webp"
    />
    <meta property="og:image" content="https://pluma.life/assets/images/og-share.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Personalized massage in Valencia Old Town · pluma</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
