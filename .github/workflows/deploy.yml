name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          VITE_CALCOM_LINK: pluma-massage-studio
          VITE_CALCOM_LINK_60: pluma-massage-studio/60m-massage
          VITE_CALCOM_LINK_90: pluma-massage-studio/90-massage
          VITE_CALCOM_LINK_120: pluma-massage-studio/120m-massage

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
